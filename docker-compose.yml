version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nimbus
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/nimbus
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    working_dir: /usr/src/app/backend
    command: sh -c "node scripts/run_migrations.js && node scripts/seed.js || true && node dist/backend/src/index.js"

  # Standalone scanner, for parity with the split deployment. The `api` service
  # above runs its scanner in-process, so this one is only useful if you set
  # ALERT_SCANNER_ENABLED=false on that service.
  scanner:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/nimbus
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      ALERT_SCANNER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    working_dir: /usr/src/app/backend
    command: node dist/backend/src/scan.js
    profiles: ["scanner"]

volumes:
  db-data: {}
  redis-data: {}
