version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned EXACTLY by Expo SDK 53 (expo/bundledNativeModules.json: react
      # 19.0.0, react-native 0.79.6). React Native 0.79.6's bundled renderer
      # throws "Incompatible React versions" unless react is exactly 19.0.0, and
      # jest-expo 53 hard-pins react-test-renderer 19.0.0, which
      # @testing-library/react-native needs to equal react. So these three move
      # only with an Expo SDK upgrade, never through Dependabot (see #18-#24).
      - dependency-name: "react"
      - dependency-name: "react-test-renderer"
      - dependency-name: "react-native"
      # Other Expo-managed packages: Expo SDK 53 pins their major.minor. A minor
      # bump here (e.g. react-native 0.79 -> 0.88 in #3) is really an SDK upgrade
      # and broke the mobile build; mobile/__tests__/expoSdkCompat.test.ts
      # enforces this. Patches still flow.
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-minor"]
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
